# Pianoid: Conda Environment Configuration
#
# Usage:
#   conda env create -f environment.yml
#   conda activate pianoid

name: m2b
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip>=23.0
  
  # PyTorch (CUDA 11.8)
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - pytorch-cuda=11.8
  
  # Data Processing
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy>=1.10.0
  
  # Visualization
  - matplotlib>=3.7.0
  
  # Utilities
  - tqdm>=4.65.0
  - pyyaml>=6.0
  - ipython
  - jupyter
  
  # Pip packages
  - pip:
    - wandb>=0.15.0
